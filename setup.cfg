[metadata]
name = edgeconnect-automation
version = 0.1.0
description = Safety-focused CSV automation for HPE Aruba EdgeConnect Orchestrator
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD-3-Clause
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    edgeconnect-auto = edgeconnect_automation.cli:main
